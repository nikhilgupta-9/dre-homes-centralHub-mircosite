# Mac app (.dmg) banane ke liye. Aapko Mac ki zarurat nahi: GitHub apna Mac khud deta hai.
# Use: GitHub par repo banao -> Actions tab -> "Build Mac app" -> Run workflow -> kuch minute baad "SpamGuard-Studio-mac" artifact download karo.
name: Build Mac app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build dmg
        shell: bash
        run: |
          set +e
          npm run dist > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -v '^\s*$' build.log | tail -20 | while IFS= read -r l; do echo "::error::$(printf '%s' "$l" | head -c 300 | tr -d '\r')"; done
          fi
          exit $rc
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build (Apple Developer ID ho to hata do aur secrets lagao)
      - uses: actions/upload-artifact@v4
        with:
          name: SpamGuard-Studio-mac
          path: dist/*.dmg
